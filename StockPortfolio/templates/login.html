{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e14">
  <title>Sign in — StockPortfolio</title>

  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('stockportfolio-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/portfolio.css' %}">
  <style>
    .logo-mark {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(160deg, var(--brand-strong), var(--brand));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 0 40px var(--brand-soft);
    }
    .auth-tabs { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 24px; }
    .auth-tabs button { flex: 1; border: none; background: var(--bg-elevated); color: var(--text-muted); font-weight: 600; font-size: 13px; padding: 10px 0; cursor: pointer; }
    .auth-tabs button.active { background: var(--brand); color: #fff; }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .input-wrap .form-control { padding-left: 38px; }
  </style>
</head>
<body>

<button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle light/dark theme" style="position:fixed;top:16px;right:16px;">
  <span class="icon-moon" style="display:inline-flex;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
  <span class="icon-sun" style="display:inline-flex;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
  <span>Theme</span>
</button>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:400px;">
    <div class="logo-mark">
      <span style="font-family:'Sora',sans-serif;font-weight:800;font-size:24px;color:#fff;">N</span>
    </div>
    <div class="text-center mb-4">
      <div class="font-display" style="font-size:20px;font-weight:700;">Navakar Stock Portfolio</div>
      <div class="text-muted-custom" style="font-size:13px;">Track your Indian equity trades</div>
    </div>

    <div class="auth-tabs" style="display: none;">
      <button type="button" id="tab-login" class="active" onclick="switchTab('login')">Sign in</button>
      <button type="button" id="tab-signup" style="display: none;" onclick="switchTab('signup')">Create account</button>
    </div>

    <div id="alert-error" class="alert-error"></div>

    <form id="form-login">
      <div class="mb-3">
        <label class="form-label" for="login-email">Email address</label>
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
        </div>
      </div>
      <button type="button" class="btn btn-primary w-100 justify-content-center" id="btn-login">Sign in</button>
    </form>

    <form id="form-signup" style="display:none;">
      <div class="mb-3">
        <label class="form-label" for="signup-name">Full name</label>
        <input type="text" id="signup-name" class="form-control" placeholder="Your name" autocomplete="name">
      </div>
      <div class="mb-3">
        <label class="form-label" for="signup-email">Email address</label>
        <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="signup-password">Password</label>
        <input type="password" id="signup-password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <button type="button" class="btn btn-primary w-100 justify-content-center" id="btn-signup">Create account</button>
    </form>

    <div class="text-center text-faint mt-4" style="font-size:11px;">
      Your personal NSE/BSE equity portfolio tracker
    </div>
  </div>
</div>

<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/api_caller.js' %}"></script>
<script src="{% static 'js/login.js' %}"></script>
<script>
  window.onload = function () {
    LoginInit(
      "{{ csrf_token }}",
      "{% url 'auth-list' %}",
      "{% url 'signup-list' %}",
      "{% url 'fe-dashboard-list' %}"
    );
  };
</script>
</body>
</html>
